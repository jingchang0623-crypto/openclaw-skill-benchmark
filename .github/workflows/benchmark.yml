name: Skill Benchmark CI

on:
  push:
    paths:
      - '**.yaml'
      - '**.yml'
  pull_request:
    paths:
      - '**.yaml'
      - '**.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Run benchmark on example skill
      run: |
        python3 benchmark.py \
          --skill-path ./example-skill.yaml \
          --runs 3 \
          --verbose
    
    - name: Upload benchmark report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-report
        path: example-skill_benchmark_report.json
